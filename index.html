<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050a30">
  <title>Jabel Ya´</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Si llega un enlace con ?api=… (el que manda el dueño) o se abre desde una instalación vieja, va directo a la app de pedidos.
    if (location.search.includes('api=') || matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
      location.replace('pedidos/' + location.search);
    }
  </script>
  <style>
    .inicio { max-width: 460px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 14px; text-align: center; }
    .inicio .btn { font-size: 18px; min-height: 64px; justify-content: flex-start; gap: 14px; text-align: left; }
    .inicio .btn img { width: 44px; height: 44px; border-radius: 10px; }
    .inicio .btn span { display: grid; }
    .inicio .btn small { font-weight: 500; font-size: 14px; color: var(--suave); }
  </style>
</head>
<body>
  <main class="inicio">
    <img class="logo-grande" src="assets/logo.jpg" alt="Purificadora Jabel Ya´, agua pura, vida sana. WhatsApp 4237 2018">
    <h2>¿Qué app quieres abrir?</h2>
    <a class="btn" href="pedidos/"><img src="icons/icon-192.png" alt=""><span>Pedidos y reparto<small>Pedidos, nuevo, mapa con GPS y clientes</small></span></a>
    <a class="btn" href="dueno/"><img src="icons/dueno-192.png" alt=""><span>Dueño<small>Resumen, gráficas, cobros y usuarios</small></span></a>
    <p class="hint">Abre cada una e instálala desde ahí: quedan como dos apps con su propio ícono.</p>
  </main>
</body>
</html>
